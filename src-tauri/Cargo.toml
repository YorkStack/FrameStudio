[package]
name = "framestudio"
version = "0.3.0"
edition = "2024"
rust-version = "1.98"
description = "Local image workshop for macOS and Windows"
license = "MIT"

[lib]
name = "framestudio"
path = "src/lib.rs"

[[bin]]
name = "framestudio"
path = "src/main.rs"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog"]

[build-dependencies]
tauri-build = {version = "=2.7.4", optional = true, features = [] }

[dependencies]
anyhow = "=1.0.104"
serde = {version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
rusqlite = {version = "=0.41.1", features = ["bundled"] }
uuid = {version = "=1.29.2", features = ["v4", "serde"] }
chrono = {version = "=0.4.45", features = ["serde"] }
base64 = "=0.23.1"
image = {version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp", "tiff"] }
reqwest = {version = "=0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
tokio = {version = "=1.54.1", features = ["full"] }
fs2 = "=0.4.3"
sha2 = "=0.11.1"
keyring = "=4.2.0"
zeroize = "=1.9.1"
axum = "=0.8.9"
rmcp = {version = "=3.9.0", features = ["transport-io", "client", "transport-child-process"] }
directories = "=6.0.0"
subtle = "=2.6.1"
scraper = { version = "=0.29.0", default-features = false }
zip = {version = "=9.5.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
ttf-parser = "=0.25.1"
lopdf = {version = "=0.46.0", default-features = false}
tauri-plugin-dialog = { version = "=2.8.4", optional = true }
tauri = {version = "=2.12.5", optional = true, features = [] }

# Existing transitive native libraries, accessed directly for metadata-only key status.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "=0.10.1"
security-framework-sys = "=2.17.0"

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
